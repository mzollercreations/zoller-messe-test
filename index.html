<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ZOLLER Messe</title>
<meta name="description" content="ZOLLER Messe-App für den Messestand: Filme, 3D-Geräte, Ersparnis-Rechner, Werkzeugraum-Planer und Kontakt – läuft auf dem iPad auch ohne Internet.">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZOLLER Messe">
<meta name="theme-color" content="#0b0c0d">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
<link rel="preload" href="assets/fonts/T-Star-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/T-Star-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/kiosk.css?v=6c37487eba">
<link rel="stylesheet" href="assets/css/capture.css?v=6c37487eba">
<link rel="stylesheet" href="assets/css/worlds.css?v=6c37487eba">
<script src="planer/assets/js/currency.js?v=6c37487eba"></script>
<script type="importmap">{"imports":{"three":"./planer/assets/vendor/three.module.min.js"}}</script>
<script type="module" src="assets/js/app.js?v=6c37487eba"></script>
</head>
<body>
<div class="boot" data-boot><img src="assets/img/zoller.svg" alt="ZOLLER"><span class="boot__bar"><i></i></span></div>

<!-- Dauerschleife, solange niemand das iPad benutzt -->
<section class="attract" data-attract hidden>
  <div class="attract__media"><video data-a="0" muted playsinline preload="auto"></video><video data-a="1" muted playsinline preload="auto"></video></div>
  <div class="attract__shade"></div>
  <div class="attract__top">
    <img class="attract__logo" src="assets/img/zoller.svg" alt="ZOLLER" data-staff-hold>
    <div class="attract__event" data-a-event></div>
  </div>
  <div class="attract__now" data-a-now></div>
  <p class="caption caption--attract" data-a-cap></p>
  <div class="attract__cta">
    <span class="attract__touch"><i></i><b data-a-touch>Berühren, um zu starten</b></span>
    <div class="attract__langs" data-a-langs></div>
  </div>
  <div class="attract__live" data-a-live></div>
</section>

<!-- Messe-App -->
<div class="app" data-app hidden>
  <header class="bar">
    <button class="bar__logo" data-staff-hold data-go="home" aria-label="Start"><img src="assets/img/zoller.svg" alt="ZOLLER"></button>
    <button class="bar__back" data-back hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span data-t="ui.back">Zurück</span></button>
    <div class="bar__title" data-bar-title></div>
    <div class="bar__tools">
      <button class="bar__btn bar__saved" data-go="contact"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-t="ui.saved">Merkliste</span><b data-saved-n>0</b></button>
      <button class="bar__btn bar__lang" data-open="lang"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z"/></svg><span data-lang-label>DE</span></button>
      <button class="bar__btn bar__end" data-open="end" aria-label="Beenden"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-t="ui.end">Beenden</span></button>
    </div>
  </header>
  <main class="views">
    <section class="view view--home" data-view="home"></section>
    <section class="view view--world" data-view="world"></section>
    <section class="view view--all" data-view="all"></section>
    <section class="view view--cycle" data-view="cycle"></section>
    <section class="view view--device" data-view="device"></section>
    <section class="view view--films" data-view="films"></section>
    <section class="view view--calc" data-view="calc"></section>
    <section class="view view--planer" data-view="planer"><iframe data-planer title="Werkzeugraum-Planer"></iframe></section>
    <section class="view view--contact" data-view="contact"></section>
    <section class="view view--thanks" data-view="thanks"></section>
  </main>
</div>

<!-- Filmspieler -->
<div class="player" data-player hidden>
  <video data-p-video playsinline preload="auto"></video>
  <p class="caption caption--player" data-p-cap></p>
  <div class="player__ui" data-p-ui>
    <div class="player__top">
      <div class="player__title" data-p-title></div>
      <button class="pbtn" data-p-cc aria-label="Untertitel"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3"/></svg></button>
      <button class="pbtn" data-p-close aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="player__bottom">
      <button class="pbtn pbtn--play" data-p-play aria-label="Abspielen"><svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg><svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <span class="player__time" data-p-time>0:00</span>
      <div class="player__track" data-p-track><i data-p-buf></i><b data-p-pos></b></div>
      <span class="player__time" data-p-dur>0:00</span>
    </div>
  </div>
  <div class="player__end" data-p-end hidden></div>
</div>

<!-- Dialoge -->
<div class="sheet" data-sheet hidden><div class="sheet__panel" data-sheet-panel></div></div>
<div class="idle" data-idle hidden>
  <div class="idle__panel">
    <svg class="idle__ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52"/><circle cx="60" cy="60" r="52" data-idle-ring/></svg>
    <b class="idle__n" data-idle-n>15</b>
    <h2 data-t="idle.h">Sind Sie noch da?</h2>
    <p data-t="idle.p">Gleich startet die Messe-App neu und löscht Ihre Auswahl.</p>
    <div class="row"><button class="btn btn--yellow" data-idle-stay data-t="idle.stay">Ja, weiter</button><button class="btn" data-idle-end data-t="idle.end">Neu starten</button></div>
  </div>
</div>
<div class="toast" data-toast hidden></div>

<!-- App gesperrt (Pause/Nacht): Entsperren mit Logo 2 s + PIN -->
<div class="lock" data-lock hidden>
  <img src="assets/img/zoller.svg" alt="ZOLLER" data-lock-hold>
  <p lang="de">Bitte wenden Sie sich an unser Standpersonal.</p>
  <p lang="en">Please ask our booth staff.</p>
  <small data-lock-ev></small>
</div>

<!-- Personalbereich -->
<div class="staff" data-staff hidden></div>
</body>
</html>
